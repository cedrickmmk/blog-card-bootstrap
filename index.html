<!DOCTYPE html>
<html lang="en">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js" integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="./style.css"> 

        <title>Frontend Mentor | Blog preview card</title>

  </head>

  <body>
    <main>
      <section class="card">
        <img src="./assets/images/illustration-article.svg" class="card-image"
         alt="illustraction article">

        <article class="card-content">

          <span class="card-badge">Learning</span>

          <p class="card-date">Published 21 dec 2023</p>

          <h1 class="card-title"><a href="#"> HTML &amp; CSS foundations</a></h1>

          <p class="card-desc">
             These languages are the backbone of every website, defining structure, content, and presentation.
          </p>

        </article>

        <article class="card-profile">
          <img src="./assets/images/image-avatar.webp" class="profile-image"
          alt="Avatar-image">

          <span class="profile-name">Greg Hooper</span>

        </article>

      </section>
    </main>

    <footer class="attribution">
            Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
            Coded by <a href="#">cedrick Mbuyamba</a>.
    </footer>
  </body>
</html>
