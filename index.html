<!DOCTYPE html>
<html lang="en">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
         <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>

 
        <link rel="stylesheet" href="./style.css"> 

        <title>Frontend Mentor | Blog preview card</title>

  </head>

  <body class="d-fex flex-column justify-content-center align-items-center min-vh-100 p-4 gap-4">

    <main class="container  ">

      <div class=" d-flex row justify-content-center ">

        <section class="card d-flex flex-column p-4 gap-4 rounded-4 ">

          <img src="./assets/images/illustration-article.svg" 
          alt="illustraction article"
          class="card-img rounded-3">
      

          <article class="card-content d-flex flex-column align-items-start gap-12 p-o ">

            <span class="card-badge align-self-start fw-bold rounded-1 px-3 py-1">Learning</span>

            <p class="card-date pt-4">Published 21 dec 2023</p>

            <h1 class="card-title mb-0 fw-bolber">
              <a href="#" class="text-decoration-none"> HTML &amp; CSS foundations</a>
            </h1>

            <p class="card-desc mb-0 fw-medium pt-4">
              These languages are the backbone of every website, defining structure, content, and presentation.
            </p>

          </article>

          <article class="card-profile d-flex align-items-ceter gap-3">
            <img src="./assets/images/image-avatar.webp" 
            class="profile-image rounded-circle"
            alt="Avatar-image">

            <span class="profile-name fw-bolder">Greg Hooper</span>

          </article>

        </section>
      </div>
    </main>

    <footer class="attribution">
            Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
            Coded by <a href="#">cedrick Mbuyamba</a>.
    </footer>
  </body>
</html>
